# Keep "Terminal Access" sessions alive while they are idle.
#
# The shell runs over a websocket through the ondemand proxy, and an idle
# session was being dropped. These keepalives mean sshd sends something every
# minute, which both keeps the ssh session itself alive and stops the proxy from
# seeing the connection as idle.
#
# 60s x 1440 is 24 hours, comfortably longer than a training day.
ClientAliveInterval 60
ClientAliveCountMax 1440
TCPKeepAlive yes
